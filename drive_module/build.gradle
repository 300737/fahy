plugins {
    id 'com.android.library'
}

android {
    namespace 'com.github.tvbox.osc.drive'
    compileSdk 36

    defaultConfig {
        minSdk 19
        // 与宿主 app 的 targetSdkVersion(28) 保持一致，避免 manifest 合并冲突
        targetSdk 28
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // AndroidX — 全部用 implementation，避免与宿主版本/资源冲突
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // CardView（localvideo 子模块封面圆角裁切容器）
    implementation 'androidx.cardview:cardview:1.0.0'

    // Room（独立数据库）
    implementation 'androidx.room:room-runtime:2.3.0'
    annotationProcessor 'androidx.room:room-compiler:2.3.0'

    // Gson（JSON 解析）
    implementation 'com.google.code.gson:gson:2.10.1'

    // OkHttp（Alist HTTP 请求）— 宿主已有，用 implementation 让宿主版本优先
    implementation 'com.squareup.okhttp3:okhttp:3.12.11'

    // Sardine（WebDAV 客户端）— 匹配宿主已有的 0.8 版本。
    // 排除其传递的 okhttp 4.x：宿主全局锁定 okhttp 3.12.11（okhttp3.internal.Version 等
    // 3.x API 被宿主代码使用），sardine v0.8 为纯 Java、仅用 3.x 二进制兼容的基础 API，
    // 在 3.12.11 下可直接运行
    implementation('com.github.thegrizzlylabs:sardine-android:0.8') {
        exclude group: 'com.squareup.okhttp3', module: 'okhttp'
        // 宿主 xstream 已带 xpp3_min:1.1.4c（同一 XmlPullParser API），排除 sardine 的旧版避免重复类
        exclude group: 'xpp3', module: 'xpp3'
    }

    // Commons Net（FTP 客户端）
    implementation 'commons-net:commons-net:3.10.0'

    // SMBJ（SMB 2.0/3.0 客户端）。排除其 bcprov-jdk15on：jcifs-ng 已带 jdk18on:1.76，
    // 同包名两份 BouncyCastle 会触发 duplicate class 冲突
    implementation('com.hierynomus:smbj:0.11.5') {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
    }

    // JCIFS-NG（SMB 1.0 / CIFS 客户端）
    implementation 'eu.agno3.jcifs:jcifs-ng:2.1.10'
    // Commons Compress + XZ（ZIP/7Z 解压，纯 Java 无 native）
    implementation 'org.apache.commons:commons-compress:1.24.0'
    implementation 'org.tukaani:xz:1.9'

    // EventBus（模块内部事件通信）— 宿主已有
    implementation 'org.greenrobot:eventbus:3.3.1'

    // Jetbrains annotations
    implementation 'org.jetbrains:annotations:24.0.1'

    // Glide（localvideo 子模块加载视频封面帧：Glide.load(视频路径) 自动提取首帧）
    implementation 'com.github.bumptech.glide:glide:4.12.0'

    // ===== 以下库已移除远程依赖，改用模块内源码实现 =====
    // BRVAH (BaseRecyclerViewAdapterHelper)  → FolderAdapter/LocalVideoAdapter/DriveAdapter 均改为标准 RecyclerView.Adapter
    // TvRecyclerView                         → DriveTvRecyclerView 替代
    // AndroidAutoSize (me.jessyan:autosize)   → DriveActivity 中移除 CustomAdapt，使用 dp/sp 直接值
    // filechooser (com.obsez.android.lib)     → 使用 Android 原生 ACTION_OPEN_DOCUMENT_TREE
    // TitleBar (com.github.getActivity:TitleBar) → 自绘 DriveTitleBar 替代
}